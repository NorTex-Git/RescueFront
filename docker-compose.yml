services:
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBSOCKET_URL: ${WEBSOCKET_URL}
    image: rescue-frontend:latest
    container_name: rescue-frontend
    environment:
      NODE_ENV: production
      BACKEND_API_URL: ${BACKEND_API_URL}
      IMAGES_SERVICE_BASE_URL: ${IMAGES_SERVICE_BASE_URL}
      NEXT_PUBLIC_WEBSOCKET_URL: ${WEBSOCKET_URL}
      JWT_SECRET: ${JWT_SECRET:-}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - rescue-network

networks:
  rescue-network:
    external: true
    name: rescue-network
